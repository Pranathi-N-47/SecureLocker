<!DOCTYPE html>
<html>
<head>
    <title>Register - Secure Locker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h4>Create Account</h4>
                    </div>
                    <div class="card-body">
                        {% with messages = get_flashed_messages() %}
                            {% if messages %}
                                <div class="alert alert-danger">{{ messages[0] }}</div>
                            {% endif %}
                        {% endwith %}

                        <form method="POST">
                            <div class="mb-3">
                                <label>Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" name="password" class="form-control" required>
                            </div>
                            
                            <div class="mb-3">
                                <label>I am a...</label>
                                <select name="role" class="form-select">
                                    <option value="Student">Student (Upload Certs)</option>
                                    <option value="Verifier">Verifier (Check Certs)</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label>Registration Access Code</label>
                                <input type="text" name="access_code" class="form-control" 
                                       placeholder="Enter University Invite Code" required>
                                <small class="text-muted d-block mt-1">
                                    (Demo: Student=`STUDENT-KEY`, Verifier=`TRUSTED-PARTNER-KEY`)
                                </small>
                            </div>

                            <button type="submit" class="btn btn-success w-100">Register</button>
                        </form>
                        
                        <div class="mt-3 text-center">
                            <a href="{{ url_for('login') }}">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
