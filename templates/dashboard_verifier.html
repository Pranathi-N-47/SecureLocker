{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h2 class="mb-4">Certificate Verification Portal</h2>
        
        <div class="card shadow p-5">
            <img src="https://img.icons8.com/ios/100/28a745/security-checked.png" class="mx-auto d-block mb-3" style="width: 80px;">
            <h4>Verify a Document</h4>
            <p class="text-muted">
                Enter the Certificate ID or Scan the QR Code provided by the student to verify the digital signature.
            </p>
            
            <form action="#" method="POST" class="mt-3">
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="Enter Certificate ID / Hash" aria-label="Certificate ID">
                    <button class="btn btn-success" type="button">Verify Integrity</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
